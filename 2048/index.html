<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#333333">
    <link rel="stylesheet" href="style.css">
    <script type="module" defer src="script.js"></script>
    <link rel="shortcut icon" href="public/favicon.ico" />
    <link rel="manifest" href="public/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="2048" />
    <link rel="icon" type="image/svg+xml" href="public/favicon.svg" />
    <link rel="icon" type="image/png" href="public/favicon-96x96.png" sizes="96x96" />
    <link rel="apple-touch-icon" sizes="180x180" href="public/apple-touch-icon.png" />
    <title>2048</title>
</head>

<body>
    <main id="game">
        <header id="header">
            <h1 id="title">2048</h1>
            <div class="score-box">
                <span class="score-label">Score</span>
                <span id="score">0</span>
            </div>
            <div class="score-box">
                <span class="score-label">Best</span>
                <span id="best-score">0</span>
            </div>
            <button id="new-game" type="button">New</button>
        </header>
        <div id="game-board">
            <div id="overlay" hidden>
                <p id="overlay-message"></p>
                <div id="overlay-buttons">
                    <button id="keep-playing" type="button">Keep going</button>
                    <button id="try-again" type="button">New game</button>
                </div>
            </div>
        </div>
        <p id="hint">Swipe or use arrow keys to join tiles</p>
    </main>
</body>

</html>
